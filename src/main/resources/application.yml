server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never  

spring:
  profiles:
    active: prod
  application:
    name: agri-farms-common-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth-prod.agrifarms.in/realms/agrifarms}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://auth-prod.agrifarms.in/realms/agrifarms/protocol/openid-connect/certs}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://agri-prod-database.cr262csoswwh.ap-south-2.rds.amazonaws.com:5432/agri?currentSchema=%22agri-common%22}
    username: ${SPRING_DATASOURCE_USERNAME:agri_db_admin_user}
    password: ${SPRING_DATASOURCE_PASSWORD:zethon123$}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: always
  mail:
    host: smtp.zoho.in
    port: 587
    username: bharath@techxplorers.in
    password: ${SMTP_PASSWORD:SfmUcd5WK2p0}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2

# Custom Keycloak Admin API & Direct Grant configuration
keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://auth-prod.agrifarms.in}
  realm: ${KEYCLOAK_REALM:agrifarms}
  client-id: ${KEYCLOAK_CLIENT_ID:agrifarms-mobile-client}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:agrifarms}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:zethon123$}

aws:
  s3:
    bucket: agri-common
    region: ap-south-1
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:default_access_key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:default_secret_key}

msg91:
  authkey: ${MSG91_AUTHKEY:514970Tegopp45hc76a43b61cP1}
  template-id: ${MSG91_TEMPLATE_ID:your_default_template_id_here}

