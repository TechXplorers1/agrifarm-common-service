      probes:
        enabled: true
      show-details: never

jwt:
  secret: ${JWT_SECRET:AgriFarmsSuperSecretKeyForLocalJwtTokensValidation2026SecureString32BytesMin!}
  expiration: ${JWT_EXPIRATION_MS:2592000000} # 30 days in ms

spring:
  profiles:
    active: prod
  application:
