name: agrifarms-create-infra

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AGRI_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AGRI_AWS_SECRET_ACCESS_KEY }}

  TF_VAR_env: ${{ vars.AGRI_PROD_ENV }}
  TF_VAR_region: ${{ vars.AGRI_PROD_REGION }}
  TF_VAR_state_bucket_name: ${{ vars.AGRI_PROD_STATE_BUCKET_NAME }}
  TF_VAR_domain_name: ${{ vars.AGRI_PROD_DOMAIN_NAME }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure

      # -----------------------------
      # DRIFT DETECTION (safe)
      # -----------------------------
      - name: Terraform Plan (refresh check)
        run: terraform plan -detailed-exitcode -lock-timeout=5m

      # -----------------------------
      # APPLY (deterministic)
      # -----------------------------
      - name: Terraform Plan (generate)
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan