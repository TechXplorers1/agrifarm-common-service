name: Build

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Get Project Version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG=$VERSION-$SHORT_SHA" >> $GITHUB_ENV

      - name: Build
        run: mvn clean package

      - name: Run Tests
        run: mvn test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:$VERSION \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Tag Images
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}

          docker tag \
            $ECR_REPOSITORY:$VERSION \
            $REGISTRY/$ECR_REPOSITORY:$VERSION

          docker tag \
            $ECR_REPOSITORY:$IMAGE_TAG \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Images
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}

          docker push $REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Save Image Tag
        run: |
          echo "$IMAGE_TAG" > image-tag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt